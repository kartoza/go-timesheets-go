name: Build and Release

on:
  release:
    types: [created]
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  build-linux:
    name: Build Linux AMD64 (native with CGO)
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build Linux AMD64
        run: |
          nix develop --command bash -c '
            set -e
            mkdir -p artifacts
            VERSION="${GITHUB_REF_NAME:-$(git describe --tags --always)}"
            VERSION="${VERSION#v}"
            echo "Building version $VERSION..."
            CGO_ENABLED=1 go build -ldflags="-s -w -X main.version=$VERSION" -o artifacts/kartoza-timesheet-linux-amd64 .
            cd artifacts
            tar -czf kartoza-timesheet-linux-amd64.tar.gz kartoza-timesheet-linux-amd64
            sha256sum *.tar.gz > checksums.txt
            cat checksums.txt
          '

      - name: Upload artifacts to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} artifacts/*.tar.gz artifacts/checksums.txt --clobber

      - name: Upload artifacts (for manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: artifacts/*
          retention-days: 7

  build-macos:
    name: Build macOS (native with CGO)
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build macOS ARM64
        run: |
          set -e
          mkdir -p artifacts
          VERSION="${GITHUB_REF_NAME:-$(git describe --tags --always)}"
          VERSION="${VERSION#v}"
          echo "Building version $VERSION..."
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=$VERSION" -o artifacts/kartoza-timesheet-darwin-arm64 .
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.version=$VERSION" -o artifacts/kartoza-timesheet-darwin-amd64 .
          cd artifacts
          tar -czf kartoza-timesheet-darwin-arm64.tar.gz kartoza-timesheet-darwin-arm64
          tar -czf kartoza-timesheet-darwin-amd64.tar.gz kartoza-timesheet-darwin-amd64
          shasum -a 256 *.tar.gz > checksums-macos.txt
          cat checksums-macos.txt

      - name: Upload artifacts to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} artifacts/*.tar.gz artifacts/checksums-macos.txt --clobber

      - name: Upload artifacts (for manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: artifacts/*
          retention-days: 7

  build-windows:
    name: Build Windows (native with CGO)
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Windows AMD64
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          VERSION="${GITHUB_REF_NAME:-$(git describe --tags --always)}"
          VERSION="${VERSION#v}"
          echo "Building version $VERSION..."
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=$VERSION" -o artifacts/kartoza-timesheet-windows-amd64.exe .
          cd artifacts
          tar -czf kartoza-timesheet-windows-amd64.tar.gz kartoza-timesheet-windows-amd64.exe
          sha256sum *.tar.gz > checksums-windows.txt
          cat checksums-windows.txt

      - name: Upload artifacts to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload ${{ github.event.release.tag_name }} artifacts/*.tar.gz artifacts/checksums-windows.txt --clobber

      - name: Upload artifacts (for manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: artifacts/*
          retention-days: 7
